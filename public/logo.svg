<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="exerciseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="sleepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (ICON) -->
  <g transform="translate(18, 14)">
    <!-- Base Rounded Container with soft gradient & shadow -->
    <rect x="0" y="0" width="152" height="152" rx="38" fill="url(#bgPillGrad)" filter="url(#logoShadow)"/>

    <!-- Subtle inner glow overlay -->
    <rect x="3" y="3" width="146" height="146" rx="35" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

    <!-- 4 HABIT ICONS IN HARMONY -->

    <!-- Quadrant 1: Water Droplet (Top Left) -->
    <g transform="translate(26, 26)">
      <circle cx="22" cy="22" r="21" fill="#ffffff" filter="url(#logoShadow)"/>
      <!-- Droplet shape -->
      <path d="M22 8 C22 8 11 22 11 27.5 A11 11 0 0 0 33 27.5 C33 22 22 8 22 8 Z" fill="url(#waterGrad)"/>
      <circle cx="25" cy="25" r="2.2" fill="#bae6fd" opacity="0.9"/>
    </g>

    <!-- Quadrant 2: Exercise Runner / Dynamic (Top Right) -->
    <g transform="translate(82, 26)">
      <circle cx="22" cy="22" r="21" fill="#ffffff" filter="url(#logoShadow)"/>
      <!-- Runner figure -->
      <circle cx="22" cy="13" r="3.5" fill="#059669"/>
      <path d="M16 23 L21 20 L25 24 L31 20 M21 25 L16 31 M25 24 L28 32 L34 35" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Quadrant 3: Sleep Crescent Moon (Bottom Left) -->
    <g transform="translate(26, 82)">
      <circle cx="22" cy="22" r="21" fill="#ffffff" filter="url(#logoShadow)"/>
      <!-- Moon and little star -->
      <path d="M27 13 A12 12 0 1 1 18 28 A10 10 0 0 0 27 13 Z" fill="url(#sleepGrad)"/>
      <polygon points="27,15 28,17 30,17 28.5,18.5 29,20.5 27,19 25,20.5 25.5,18.5 24,17 26,17" fill="#facc15"/>
    </g>

    <!-- Quadrant 4: Medication Capsule (Bottom Right) -->
    <g transform="translate(82, 82)">
      <circle cx="22" cy="22" r="21" fill="#ffffff" filter="url(#logoShadow)"/>
      <!-- Rotated Pill capsule -->
      <g transform="rotate(-45 22 22)">
        <path d="M14 15 A7 7 0 0 1 30 15 L30 22 L14 22 Z" fill="url(#medGrad)"/>
        <path d="M14 22 L30 22 L30 29 A7 7 0 0 1 14 29 Z" fill="#fbbf24"/>
        <line x1="14" y1="22" x2="30" y2="22" stroke="#ffffff" stroke-width="2"/>
      </g>
    </g>

    <!-- Center Connected Vitality Heart Emblem -->
    <circle cx="76" cy="76" r="16" fill="#ffffff" filter="url(#logoShadow)"/>
    <path d="M76 83 C76 83 67 78 67 73.5 A3.5 3.5 0 0 1 73.5 70.5 C74.8 70.5 75.6 71.2 76 71.8 C76.4 71.2 77.2 70.5 78.5 70.5 A3.5 3.5 0 0 1 85 73.5 C85 78 76 83 76 83 Z" fill="#10b981"/>
  </g>

  <!-- TYPOGRAPHY / BRAND NAME -->
  <g transform="translate(196, 42)">
    <!-- Primary App Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="-1">
      Hábitos <tspan fill="#0284c7">Simples</tspan>
    </text>

    <!-- Badge / Subtitle Pill -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="310" height="26" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
      <circle cx="12" cy="13" r="3.5" fill="#10b981"/>
      <text x="22" y="17" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#166534" letter-spacing="0.3">
        ÁGUA • EXERCÍCIO • SONO • REMÉDIOS
      </text>
    </g>

    <!-- Tagline -->
    <text x="0" y="104" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="-0.2">
      Seu dia a dia organizado, 100% offline e sem complicação.
    </text>
  </g>
</svg>
